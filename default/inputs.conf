[script://$SPLUNK_HOME/etc/apps/TA-sensors/bin/sensors_events.py]
interval = 60
index = main
sourcetype = sensors:status
source = sensors-events
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14

[script://$SPLUNK_HOME/etc/apps/TA-sensors/bin/sensors_metrics.py]
interval = 60
index = metrics
sourcetype = sensors:metrics
source = sensors-metrics
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14

[script://$SPLUNK_HOME/etc/apps/TA-sensors/bin/license_beacon.py]
interval = 3600
index = main
sourcetype = ta_license:status
source = ta_license:TA-sensors
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14
